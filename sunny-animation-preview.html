</style></head><body><main class="sample"><div class="topline">SUNNY · FRAME BY FRAME</div><h1>轉過頭，聽你說。</h1><p class="intro">Sunny 的第一組逐格動作樣本。停一下、轉頭、眨眼，再回到原來的角度。</p><div class="layout"><section class="stage"><span class="badge" id="phase">準備中</span><canvas id="bird" width="640" height="640" role="img" aria-label="Sunny 麻雀的轉頭與眨眼逐格動畫"></canvas></section><section class="details"><h2>小暖 Sunny</h2><p>這次的動作來自重新繪製的中間影格，沒有套用整張圖片旋轉或彈跳。</p><div class="controls"><button class="primary" id="play" disabled>載入中</button><button id="replay" disabled>從頭播放</button><button id="step" disabled>下一格</button></div><div class="settings"><label><input type="checkbox" id="loop" checked>循環播放</label><label>速度<select id="speed"><option value="0.75">0.75 倍</option><option value="1" selected>正常</option><option value="1.25">1.25 倍</option></select></label></div><p id="message" role="status">正在準備動畫圖片…</p></section></div><section class="timeline" aria-label="逐格查看"><div class="timeline-title"><span>點選影格，查看轉頭與眨眼</span><span id="counter" aria-hidden="true">1 / 12</span></div><div class="frames" id="frames"></div></section><p class="note">無聲動畫樣本，尚未連接語音或嘴型。這一版先確認 Sunny 的外觀與動作；其他兩隻尚未製作逐格動畫。若系統設定減少動態效果，預設保持靜止，可用「下一格」查看。</p></main>

const img=new Image(),canvas=document.querySelector('#bird'),ctx=canvas.getContext('2d');
const play=document.querySelector('#play'),replay=document.querySelector('#replay'),step=document.querySelector('#step');
const loop=document.querySelector('#loop'),speed=document.querySelector('#speed'),phase=document.querySelector('#phase'),message=document.querySelector('#message'),counter=document.querySelector('#counter');
const timings=[2000,90,90,100,650,55,95,55,600,100,100,1600];
const labels=['安靜陪伴','慢慢轉頭','慢慢轉頭','慢慢轉頭','看向你','輕輕眨眼','輕輕眨眼','輕輕眨眼','專心聆聽','回到原位','回到原位','安靜陪伴'];
let current=0,timer=null,playing=false,ready=false;const thumbs=[];
function draw(context,n,size,pad=0){const cell=img.width/4;context.clearRect(0,0,size,size);context.drawImage(img,(n%4)*cell,Math.floor(n/4)*cell,cell,cell,pad,pad,size-2*pad,size-2*pad);}
function render(){if(!ready)return;draw(ctx,current,640,38);counter.textContent=(current+1)+' / 12';phase.textContent=labels[current];thumbs.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===current)));}
function stop(announce=true){clearTimeout(timer);timer=null;playing=false;play.textContent='播放動畫';if(announce)message.textContent='已暫停。可以點選下方影格，或按「下一格」。';}
function schedule(){clearTimeout(timer);if(!playing)return;timer=setTimeout(()=>{if(current===11&&!loop.checked){stop(false);message.textContent='播放完畢。';return;}current=(current+1)%12;render();schedule();},timings[current]/Number(speed.value));}
function start(){if(!ready)return;playing=true;play.textContent='暫停動畫';message.textContent='正在播放：轉頭、眨眼、聆聽，再回到原位。';schedule();}
play.onclick=()=>playing?stop():start();replay.onclick=()=>{stop(false);current=0;render();start();};step.onclick=()=>{stop(false);current=(current+1)%12;render();message.textContent='目前是第 '+(current+1)+' 格，'+labels[current]+'。';};speed.onchange=()=>{if(playing)schedule();};
img.onload=()=>{ready=true;for(let n=0;n<12;n++){const b=document.createElement('button'),c=document.createElement('canvas'),label=document.createElement('span');c.width=c.height=100;c.setAttribute('aria-hidden','true');b.className='frame';b.setAttribute('aria-label','第 '+(n+1)+' 格：'+labels[n]);label.textContent=n+1;b.append(c,label);draw(c.getContext('2d'),n,100,5);b.onclick=()=>{stop(false);current=n;render();message.textContent='目前是第 '+(n+1)+' 格，'+labels[n]+'。';};document.querySelector('#frames').append(b);thumbs.push(b);}play.disabled=replay.disabled=step.disabled=false;render();if(matchMedia('(prefers-reduced-motion: reduce)').matches){stop(false);message.textContent='已依照減少動態效果設定暫停，可逐格查看。';}else start();};
img.onerror=()=>{message.textContent='動畫圖片無法載入，請查看此頁下方的 GIF 動畫樣本。';phase.textContent='圖片未載入';};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',()=>stop(false));
img.src=atlasUri;
</script></body></html>
